name: Build and Deploy Site
on:
  push:
    branches: [main]
    paths:
      - "build_site.py"
      - "assets/**"
      - "favicon.png"
      - "CNAME"
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Stagger the scheduled rebuild
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 1800))

      - name: Build static site
        run: |
          python build_site.py
          cp -r assets/. public_site/assets/
          cp favicon.png public_site/favicon.png
          cp CNAME public_site/CNAME
          echo "Verifying CNAME landed in the deploy artifact:"
          cat public_site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # A "Re-assert custom domain" step used to live here. It PUT to
      # /repos/{repo}/pages with only {"cname":..., "https_enforced":true}
      # and ran with `if: always()`, i.e. after EVERY deploy including
      # successful ones. That payload omits build_type, which resets the
      # Pages site off the "workflow" build type that actions/deploy-pages
      # requires - so the very next deploy failed with
      # "Failed to create deployment (status: 404) ... Ensure GitHub Pages
      # has been enabled", and the live site 404'd until Pages was manually
      # re-enabled. It reproduced exactly that way on 2026-08-14: Pages was
      # re-enabled, one deploy succeeded, this step ran, and the following
      # deploy failed again with the same 404.
      #
      # It is not needed. The custom domain is configured in repo settings,
      # and the CNAME file is copied into the artifact by the build job
      # above, which is what actually carries the domain through a deploy.
